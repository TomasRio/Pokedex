<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link href="styles.css" rel="stylesheet" />
</head>
<body>
    <form action="" onsubmit="searchPokemon(event)">
        <div class="search-container">
            <select name="searchType" id="searchType">
                <option value="name">Por Nombre</option>
                <option value="id">Por ID</option>
            </select>
            <input type="text" name="pokemon" id="pokemonInput" autocomplete="off" placeholder="Nombre del Pokémon...">
            <button type="submit">Buscar</button>
        </div>
    </form>
    <div data-poke-card class="poke-card">
        <div data-poke-name>Pokedex</div>
        <div data-poke-img-container class="img-container">
            <img data-poke-img class="poke-img" src="./poke-shadow.png"/>
        </div>
        <div data-poke-id></div>
        <div data-poke-types class="poke-types"></div>
        <div data-poke-stats class="poke-stats"></div>
        <button id="addToListBtn" class="add-btn">Agregar a mi lista</button>
    </div>
    
    <div class="my-list-section">
        <h2>MI EQUIPO DE 6</h2>
        <div data-my-list class="my-list-cards"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="script.js" type="text/javascript"></script>
</body>
</html>
